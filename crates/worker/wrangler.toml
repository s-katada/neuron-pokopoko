name = "neuron-pokopoko"
main = "build/worker/shim.mjs"
compatibility_date = "2026-10-01"
# 入口はカスタムドメイン 1 つにする。workers.dev を裏口にしない。
workers_dev = false
preview_urls = false
routes = [{ pattern = "neuron-pokopoko.digletts.dev", custom_domain = true }]

[build]
command = "worker-build --release"

# navigate はアセット優先で index.html が返る。/api は Worker 直行にする。
[assets]
directory = "../../web/dist"
not_found_handling = "single-page-application"
run_worker_first = [ "/api/*" ]

[observability]
enabled = true

[dev]
port = 8787

[[d1_databases]]
binding = "DB"
database_name = "neuron-pokopoko"
database_id = "1e37dc47-0284-42fe-b1bc-4134e664b4a6"
migrations_dir = "migrations"

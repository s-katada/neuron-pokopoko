[package]
name = "poko"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
poko-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
ureq = { version = "3.4.2", default-features = false, features = ["json"] }

[dev-dependencies]
assert_cmd = "2.2.2"
